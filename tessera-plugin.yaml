id: linz_departures
version: 0.2.1
api: "0.12"
icon: tram
maintainer: schli
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12
permissions:
  network: [www.linzag.at]
attributes: [cloud]
privacy: https://github.com/Schlizor/tessera_linzlinien#privacy
fetch:
  - id: stop_search
    url: "https://www.linzag.at/static/XML_STOPFINDER_REQUEST?sessionID=0&locationServerActive=1&type_sf=stop&name_sf={search}&outputFormat=JSON&coordOutputFormat=WGS84%5Bdd.ddddd%5D&limit=10"
    every: 1d
    map:
      items: "$.stopFinder.points[*]"
      value: ref.id
      label: name
      where: { type: stop }
  - id: departures
    url: "https://www.linzag.at/static/XML_DM_REQUEST?sessionID=0&locationServerActive=1&outputFormat=rapidJSON&depType=stopEvents&type_dm=any&name_dm={stop}&mode=direct&useRealtime=1&limit=40"
    every: 1m
    map:
      items: "$.stopEvents[*]"
      fields:
        line: transportation.number
        destination: transportation.destination.name
        planned: { path: departureTimePlanned, as: epoch }
        estimated: { path: departureTimeEstimated, as: epoch }
        platform: location.properties.platform
        realtime: isRealtimeControlled
        cancelled: isCancelled
      sort: estimated
      limit: 8
tiles:
  - id: departures
    name: tile_name
    icon: tram
    sizes: { min: 2x1, max: 4x2 }
    memory: 1400
    data: departures
    options:
      - id: stop
        kind: choice
        label: stop
        hint: stop_hint
        search: true
        options_from: stop_search
    example: tile_example
