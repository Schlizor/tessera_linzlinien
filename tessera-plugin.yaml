id: linz_departures
version: 0.8.0
api: "0.12"
icon: tram
maintainer: schli
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16
permissions:
  network: [www.linzag.at]
attributes: [cloud]
privacy: https://github.com/Schlizor/tessera_linzlinien#privacy
fetch:
  - id: stop_search
    url: "https://www.linzag.at/static/XML_STOPFINDER_REQUEST?sessionID=0&locationServerActive=1&type_sf=stop&name_sf={search}&outputFormat=JSON&coordOutputFormat=WGS84%5Bdd.ddddd%5D&limit=10"
    every: 1d
    map:
      items: "$.stopFinder.points[*]"
      value: ref.id
      label: name
      where: { type: stop }
  - id: departures
    url: "https://www.linzag.at/static/XML_DM_REQUEST?sessionID=0&locationServerActive=1&outputFormat=rapidJSON&depType=stopEvents&type_dm=any&name_dm={stop}&mode=direct&useRealtime=1&limit=40"
    every: 1m
    map:
      items: "$.stopEvents[*]"
      fields:
        line: transportation.number
        destination: transportation.destination.name
        planned: { path: departureTimePlanned, as: epoch }
        estimated: { path: departureTimeEstimated, as: epoch }
        platform: location.properties.platform
        realtime: isRealtimeControlled
        cancelled: isCancelled
        hints: hints[*].content
        info_links: infos[*].infoLinks[*].urlText
        info_subtitles: infos[*].infoLinks[*].subtitle
      sort: estimated
      limit: 40
  - id: lines
    url: "https://www.linzag.at/static/XML_DM_REQUEST?sessionID=0&locationServerActive=1&outputFormat=rapidJSON&depType=stopEvents&type_dm=any&name_dm={stop}&mode=direct&useRealtime=1&limit=40"
    every: 1h
    map:
      items: "$.stopEvents[*]"
      value: transportation.number
      label: transportation.number
  - id: directions
    url: "https://www.linzag.at/static/XML_DM_REQUEST?sessionID=0&locationServerActive=1&outputFormat=rapidJSON&depType=stopEvents&type_dm=any&name_dm={stop}&mode=direct&useRealtime=1&limit=40"
    every: 1h
    map:
      items: "$.stopEvents[*]"
      value: transportation.destination.name
      label: transportation.destination.name
tiles:
  - id: next
    name: tile_name
    icon: tram
    sizes: { min: 1x1, max: 4x2 }
    memory: 1400
    data: departures
    preview: { badge: "{line}", title: "{destination}", countdown: estimated }
    options:
      - id: title
        kind: text
        label: title
        hint: title_hint
      - id: stop
        kind: choice
        label: stop
        hint: stop_hint
        search: true
        options_from: stop_search
      - id: platform
        kind: text
        label: platform
        hint: platform_hint
      - id: line
        kind: choice
        multiple: 6
        label: line
        hint: line_hint
        options_from: lines
      - id: direction_a
        kind: choice
        label: direction_a
        hint: direction_a_hint
        options_from: directions
      - id: direction_b
        kind: choice
        label: direction_b
        hint: direction_b_hint
        options_from: directions
      - id: show_platform
        kind: toggle
        label: show_platform
        hint: show_platform_hint
        default: true
      - id: show_time
        kind: toggle
        label: show_time
        hint: show_time_hint
        default: true
    example: next_tile_example

cards:
  - { id: details, name: details_card }
